[package]
name = "eternity2-peps"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
eternity2-core = { path = "../core" }
eternity2-benchmark = { path = "../benchmark" }
eternity2-puzzle-io = { path = "../puzzle-io" }
ndarray = "0.15"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "peps_solve"
path = "src/bin/peps_solve.rs"
