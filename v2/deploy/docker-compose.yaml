name: eternity2

# Single compose file (V2_DESIGN.md "Infra — collapse three layers into one").
# Two services, no Envoy. Server exposes gRPC + gRPC-Web on one port.

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: eternity2-server:dev
    environment:
      E2_SERVER_BIND: "0.0.0.0:50051"
      RUST_LOG: "info"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 2s
      retries: 3
    ports:
      - "50051:50051"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: eternity2-frontend:dev
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
