[package]
name = "eternity2-peps"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
eternity2-core = { path = "../core" }
eternity2-benchmark = { path = "../benchmark" }
eternity2-puzzle-io = { path = "../puzzle-io" }
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-linalg = { version = "0.17" }
openblas-src = { version = "0.10", features = ["system", "cblas", "lapacke", "native-tls"], default-features = false }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "peps_solve"
path = "src/bin/peps_solve.rs"

[[bin]]
name = "peps_marginals_export"
path = "src/bin/peps_marginals_export.rs"
