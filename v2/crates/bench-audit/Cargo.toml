[package]
name = "eternity2-bench-audit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
eternity2-benchmark = { path = "../benchmark" }
eternity2-core = { path = "../core" }
eternity2-events = { path = "../events" }
eternity2-export = { path = "../export" }
eternity2-generator = { path = "../generator" }
eternity2-puzzle-io = { path = "../puzzle-io" }
eternity2-localsearch = { path = "../localsearch" }
eternity2-propagators = { path = "../propagators" }
eternity2-sat-encoder = { path = "../sat-encoder" }
eternity2-solver-engine = { path = "../solver-engine" }
eternity2-solver-trait = { path = "../solver-trait" }
rayon = "1.10"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports", "cargo_bench_support"] }

[[bench]]
name = "hot_paths"
harness = false

[[bin]]
name = "fleet"
path = "src/bin/fleet.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "sweep_depth"
path = "src/bin/sweep_depth.rs"

[[bin]]
name = "run_e2_5min"
path = "src/bin/run_e2_5min.rs"

[[bin]]
name = "run_e2_5min_bp_ab"
path = "src/bin/run_e2_5min_bp_ab.rs"

[[bin]]
name = "run_e2_restart"
path = "src/bin/run_e2_restart.rs"

[[bin]]
name = "rescore_board"
path = "src/bin/rescore_board.rs"

[[bin]]
name = "run_e2_framefirst"
path = "src/bin/run_e2_framefirst.rs"

[[bin]]
name = "run_e2_hintcentric"
path = "src/bin/run_e2_hintcentric.rs"

[[bin]]
name = "run_e2_backtrack_diag"
path = "src/bin/run_e2_backtrack_diag.rs"

[[bin]]
name = "run_e2_initial_domains"
path = "src/bin/run_e2_initial_domains.rs"

[[bin]]
name = "run_8x8_solve"
path = "src/bin/run_8x8_solve.rs"

[[bin]]
name = "run_generated_pipeline"
path = "src/bin/run_generated_pipeline.rs"

[[bin]]
name = "run_e2_rectangle_path"
path = "src/bin/run_e2_rectangle_path.rs"

[[bin]]
name = "run_12x12_rectangle_path"
path = "src/bin/run_12x12_rectangle_path.rs"

[[bin]]
name = "run_e2_rectangle_full_pipeline"
path = "src/bin/run_e2_rectangle_full_pipeline.rs"

[[bin]]
name = "run_e2_layered_pipeline"
path = "src/bin/run_e2_layered_pipeline.rs"

[[bin]]
name = "vanilla_fast"
path = "src/bin/vanilla_fast.rs"

[[bin]]
name = "vanilla_fastest"
path = "src/bin/vanilla_fastest.rs"

[[bin]]
name = "landscape_explorer"
path = "src/bin/landscape_explorer.rs"

[[bin]]
name = "dump_puzzle_csv"
path = "src/bin/dump_puzzle_csv.rs"

[[bin]]
name = "vanilla_fast_n"
path = "src/bin/vanilla_fast_n.rs"
