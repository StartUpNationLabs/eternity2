[package]
name = "eternity2-benchmark"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "eternity2-benchmark"
path = "src/main.rs"

[[bin]]
name = "official_e2"
path = "src/bin/official_e2.rs"

[[bin]]
name = "rtcp"
path = "src/bin/rtcp.rs"

[[bin]]
name = "pt_e2"
path = "src/bin/pt_e2.rs"

[[bin]]
name = "greedy_diag"
path = "src/bin/greedy_diag.rs"

[[bin]]
name = "directed_e2"
path = "src/bin/directed_e2.rs"

[[bin]]
name = "harvest_plateau"
path = "src/bin/harvest_plateau.rs"

[[bin]]
name = "analyze_overlap"
path = "src/bin/analyze_overlap.rs"

[[bin]]
name = "analyze_topology"
path = "src/bin/analyze_topology.rs"

[[bin]]
name = "houdayer_offline"
path = "src/bin/houdayer_offline.rs"

[[bin]]
name = "audit_hints"
path = "src/bin/audit_hints.rs"

[[bin]]
name = "central_repair"
path = "src/bin/central_repair.rs"

[[bin]]
name = "worst_region_repair"
path = "src/bin/worst_region_repair.rs"

[[bin]]
name = "prefix_compare"
path = "src/bin/prefix_compare.rs"

[dependencies]
eternity2-core = { path = "../core" }
eternity2-events = { path = "../events" }
eternity2-generator = { path = "../generator" }
eternity2-localsearch = { path = "../localsearch" }
eternity2-solver-engine = { path = "../solver-engine" }
eternity2-solver-naive = { path = "../solver-naive" }
eternity2-solver-trait = { path = "../solver-trait" }
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
