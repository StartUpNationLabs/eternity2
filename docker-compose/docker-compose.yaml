services:
  grpc-server:
    container_name: grpc-server
    image: ghcr.io/startupnationlabs/eternity2/grpc-server:latest
    # Uncomment 'build' section below to build from source instead of using pre-built image
    # build:
    #   context: .
    #   dockerfile: api/Dockerfile
    networks:
      - eternity2

  envoy:
    image: ghcr.io/startupnationlabs/eternity2/envoy:latest
    # Uncomment 'build' section below to build from source instead of using pre-built image
    # build:
    #   context: envoy
    #   dockerfile: Dockerfile
    environment:
      - SOLVER_API=grpc-server
      - SOLVER_API_PORT=50051
      - NGINX_FRONTEND_PORT=80
      - NGINX_FRONTEND=frontend
      - SOLVER_API_PREFIX=${BASE_PREFIX:-/eternity2}/api/
      - FRONTEND_PREFIX=${BASE_PREFIX:-/eternity2}/
    ports:
      - "50052:50052"
      - "80:50052"
      - "9901:9901"
    networks:
      - eternity2

  frontend:
    container_name: frontend
    image: ghcr.io/startupnationlabs/eternity2/frontend:latest
    # Uncomment 'build' section below to build from source instead of using pre-built image
    # build:
    #   context: frontend
    #   dockerfile: Dockerfile
    environment:
      # SERVER_BASE_URL is the URL of the Envoy proxy from the frontend's perspective (client-side)
      - SERVER_BASE_URL=${BASE_PREFIX:-/eternity2}/api
      - PREFIX=${BASE_PREFIX:-/eternity2}
    networks:
      - eternity2

networks:
  eternity2:
