        The Eternity II puzzle is a famous edge-matching puzzle released in 2007 with a $2 million prize for the first
        complete solution. With 256 unique pieces and over 10<sup>500</sup> possible arrangements, it remains one of the
        hardest combinatorial optimization problems.
        .
        The goal is to arrange the pieces in a 16x16 grid so that all adjacent edges match in color and pattern.
        The puzzle is known for its complexity and has been the subject of extensive research in mathematics and
        computer science.
