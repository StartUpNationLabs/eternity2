server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gRPC-Web traffic is proxied through /grpc to the server container.
    # Server CORS is permissive; this still buys us same-origin for
    # streamed responses and avoids preflights in production.
    location /grpc/ {
        grpc_pass grpc://server:50051;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
