name: Build and Push API Docker Image

on:
  push:
    paths:
      - "api/**"
      - "solver/**"
      - .github/workflows/docker-bp-api.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and load docker image
        id: load-image
        run: |
          nix build .#grpc-server-docker
          LOAD_OUTPUT=$(docker load --input result)
          echo "LOADED_TAG=$(echo "$LOAD_OUTPUT" | grep -o 'eternity2-grpc-server:[a-zA-Z0-9]*' | cut -d':' -f2)" >> $GITHUB_OUTPUT

      - name: Tag and push docker image
        run: |
          # Generate tag based on commit hash
          TAG=$(git rev-parse --short HEAD)
          IMAGE_NAME=ghcr.io/startupnationlabs/eternity2/grpc-server
          
          # Tag the loaded image with the exact tag
          docker tag eternity2-grpc-server:${{ steps.load-image.outputs.LOADED_TAG }} $IMAGE_NAME:$TAG
          docker tag eternity2-grpc-server:${{ steps.load-image.outputs.LOADED_TAG }} $IMAGE_NAME:latest

          # Push both tags
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest
